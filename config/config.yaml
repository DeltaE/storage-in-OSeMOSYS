# ---------------------------------------------------------------------------
# storage-in-OSeMOSYS run configuration (one scenario per run of workflow/main.py)
# Values below reproduce the published study (ERC-105849); see REPRODUCIBILITY.md.
# notebooks/reproduce_study.ipynb rewrites the scenario block automatically.
# All paths are relative to the repository root.
# ---------------------------------------------------------------------------

# --- scenario ---------------------------------------------------------------
scenario_name: k4h1WND        # label convention: k<rep. days>h<hours per block><resource>[_limited]
resource: WND                 # WND | SOL | HYD (used for labels and the k365h1 baseline file)
n_clusters: 4                 # representative days k (365 = full-year benchmark)
hour_grouping: 1              # intra-day block length h in hours: 1, 2, 4, 6, 8, 12
days_in_year: 365
seasons: 1
random_state: 0               # k-means seed; manuscript uses 0 (n_init = 1, k-means++)
vre_technology: WINDPOWER     # technology label used in every data/timeseries CF file

# --- storage -----------------------------------------------------------------
# StorageMaxCapacity caps TOTAL energy capacity (new + residual), kW.yr.
#   1000 -> non-binding (all unconstrained runs, Sections 4.1-4.3)
#   0.2  -> stress test (Section 4.4); reported NewStorageCapacity is then 0.15
StorageMaxCapacity: 1000.0
ResidualStorageCapacity: 0.05
# StorageLevelStart is NOT applied: the initial SoC is an optimisation variable (Section 3.3).
StorageLevelStart: 0.05

# --- inputs ------------------------------------------------------------------
system_inputs: data/system      # OSeMOSYS parameter CSVs shared by all formulations (Table 3)
data_8760:                      # hourly time series
  directory: data/timeseries
  CF: CapacityFactor_Wind.csv   # WND: CapacityFactor_Wind.csv | SOL: CapacityFactor_Solar.csv | HYD: CapacityFactor_Hydro.csv
  SDP: SpecifiedDemandProfile.csv

# --- outputs -----------------------------------------------------------------
results:
  directory: results
  directory_GUI: results/GUI
  results_copied_filename: Storage_Level
  results_excel_file: Simulation_Results.xlsx

# --- formulation definitions (Novo in the paper = Model_Cluster in the code) ---
cases:
  Model_Cluster:
    data_glp: Cluster.glp
    data_sol: Cluster.sol
    input_otoole_csv:
      capacity_factor: CapacityFactor.csv
      conversionlts: Conversionlts.csv
      daytype: DAYTYPE.csv
      directory: inputs_csv
      specified_demand_profile: SpecifiedDemandProfile.csv
      timeslice: TIMESLICE.csv
      timeslicecro: TIMESLICECRO.csv
      yearsplit: YearSplit.csv
    model_file: osemosys_fast_Cluster.txt
    otoole_config: otoole_config_Cluster.yaml
    output_otoole_txt: Cluster.txt
    results:
      directory: results
      power_capacity: NewCapacity.csv
      storage_capacity: NewStorageCapacity.csv
      storage_level: StorageLevelTSStart.csv
    root_directory: models/Model_Cluster
    simulation_results: simulation_results.txt
  Model_Kotzur:
    data_glp: Kotzur.glp
    data_sol: Kotzur.sol
    input_otoole_csv:
      capacity_factor: CapacityFactor.csv
      conversionld: Conversionld.csv
      conversionldc: Conversionldc.csv
      dayscro: DAYSCRO.csv
      daytype: DAYTYPE.csv
      directory: inputs_csv
      specified_demand_profile: SpecifiedDemandProfile.csv
      timeslice: TIMESLICE.csv
      yearsplit: YearSplit.csv
    model_file: osemosys_fast_Kotzur.txt
    otoole_config: otoole_config_Kotzur.yaml
    output_otoole_txt: Kotzur.txt
    results:
      directory: results
      power_capacity: NewCapacity.csv
      storage_capacity: NewStorageCapacity.csv
      storage_level: StorageLevelChronoDayStart.csv
      storage_levelTS: StorageLevelTSResults.csv
      storage_level_Start: StorageLevelStartResults.csv
    root_directory: models/Model_Kotzur
    simulation_results: simulation_results.txt
  Model_Niet:
    data_glp: Niet.glp
    data_sol: Niet.sol
    input_otoole_csv:
      capacity_factor: CapacityFactor.csv
      daytype: DAYTYPE.csv
      directory: inputs_csv
      specified_demand_profile: SpecifiedDemandProfile.csv
      timeslice: TIMESLICE.csv
      yearsplit: YearSplit.csv
    model_file: osemosys_fast_Niet.txt
    otoole_config: otoole_config_Niet.yaml
    output_otoole_txt: Niet.txt
    results:
      directory: results
      power_capacity: NewCapacity.csv
      storage_capacity: NewStorageCapacity.csv
      storage_level: StorageLevelTSStart.csv
    root_directory: models/Model_Niet
    simulation_results: simulation_results.txt
  Model_Welsch:
    data_glp: Welsch.glp
    data_sol: Welsch.sol
    input_otoole_csv:
      capacity_factor: CapacityFactor.csv
      conversionld: Conversionld.csv
      conversionlh: Conversionlh.csv
      conversionls: Conversionls.csv
      dailytimebracket: DAILYTIMEBRACKET.csv
      daysindaytype: DaysInDayType.csv
      daytype: DAYTYPE.csv
      directory: inputs_csv
      specified_demand_profile: SpecifiedDemandProfile.csv
      timeslice: TIMESLICE.csv
      yearsplit: YearSplit.csv
    model_file: osemosys_fast_Welsch.txt
    otoole_config: otoole_config_Welsch.yaml
    output_otoole_txt: Welsch.txt
    results:
      directory: results
      power_capacity: NewCapacity.csv
      storage_capacity: NewStorageCapacity.csv
      storage_level: StorageLevelDayTypeStart.csv
      storage_levelTS: StorageLevelTSResults.csv
      storage_level_Start: StorageLevelStartResults.csv
    root_directory: models/Model_Welsch
    simulation_results: simulation_results.txt
